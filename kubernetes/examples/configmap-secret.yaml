apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: "debug"
  application.properties: |
    server.port=8080
    feature.x=true
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  DB_PASSWORD: "s3cret"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL; echo DB_PASSWORD=$DB_PASSWORD; echo '--- file:'; cat /config/application.properties"]
    env:
    - name: LOG_LEVEL
      valueFrom:
        configMapKeyRef: { name: app-config, key: LOG_LEVEL }
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef: { name: db-credentials, key: DB_PASSWORD }
    volumeMounts:
    - name: config
      mountPath: /config
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: app-config
      items:
      - key: application.properties
        path: application.properties
