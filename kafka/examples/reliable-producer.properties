# CONFIG SKETCH (not run here): a durability-first producer, using settings documented in the Kafka 4.3 producer configs.
bootstrap.servers=localhost:9092
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.StringSerializer
acks=all                       # wait for the full set of in-sync replicas
enable.idempotence=true        # default in 4.3: resends do not create duplicates
delivery.timeout.ms=120000     # upper bound for send + retries (default 2 min)
linger.ms=5                    # small delay so records batch together (default 5 ms in 4.3)
batch.size=16384               # default batch size in bytes
