# CONFIG SKETCH (not run here): a consumer that commits after processing (at-least-once).
bootstrap.servers=localhost:9092
group.id=orders-service
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
enable.auto.commit=false       # you decide when offsets are committed (default is true)
auto.offset.reset=earliest     # only used when the group has no committed offset (default is latest)
max.poll.interval.ms=300000    # max time between poll() calls before the consumer is considered failed
